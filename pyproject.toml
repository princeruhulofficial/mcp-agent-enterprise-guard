[project]
name = "mcp-agent-enterprise-guard"
version = "0.1.0"
description = "Compute trust scores, permission decisions, and silent-failure risk for AI agents in enterprise environments — pure local computation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]

[project.scripts]
mcp-agent-enterprise-guard = "agent_enterprise_guard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_enterprise_guard"]
